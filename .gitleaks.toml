title = "dLinc Gitleaks Config"

# useDefault and path can NOT be used at the same time. Choose one.
[extend]
# useDefault will extend the default gitleaks config built in to the binary
# the latest version is located at:
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
useDefault = true

[[rules]]
id = "secret-key-multibase"
description = "Detects multibase encoded private key material"
regex = '''(?i)[\w.-]{0,50}?(?:seed|secret|token|secretKey|secretKeySeed)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9]{0,50})(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 4
keywords = ["z1A"]

# Ensure that plain did's are allowed
[[allowlists]]
regexTarget = "line"
regexes = [
  '''did:''',
]